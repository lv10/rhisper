name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Two macOS jobs. The Intel one keeps the name `rust-macos` (the required
  # status check): GitHub's arm64 macOS pool has been short on capacity and
  # jobs time out waiting for a runner. The arm64 job still runs so Apple
  # Silicon is covered when a runner is free, but cannot fail the workflow.
  rust-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust-macos
            runner: macos-15-intel
            optional: false
          - name: rust-macos-arm64
            runner: macos-latest
            optional: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: brew install nasm sox ffmpeg

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
