name: Release

on:
  push:
    tags:
      - "v*"
  # Allows manually re-running the pipeline against an existing tag (e.g. to
  # retest one publish job after fixing credentials) via:
  #   gh workflow run release.yml --ref v0.2.0
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Check the released commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA (ref $GITHUB_REF_NAME) is not an ancestor of main - refusing to publish a release from a commit that hasn't been merged to main"
            exit 1
          fi

  build:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Run test suite
        run: cargo test --release --locked

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Build AUR source tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="rhisper-${version}/" -o "rhisper-${version}.tar.gz" "$GITHUB_REF_NAME"

      - name: Collect packages into a flat directory
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp rhisper-*.tar.gz dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-aur:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Prepare PKGBUILD for this release
        run: |
          pacman -Sy --noconfirm --needed curl >/dev/null
          useradd -m builder
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/PKGBUILD
          curl -sL -o "rhisper-${version}.tar.gz" \
            "https://github.com/lv10/rhisper/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha256=$(sha256sum "rhisper-${version}.tar.gz" | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${sha256}')/" packaging/PKGBUILD
          chown -R builder:builder .

      - name: Generate .SRCINFO
        run: su builder -c "cd packaging && makepkg --printsrcinfo > .SRCINFO"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: rhisper
          pkgbuild: packaging/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"

  publish-apt:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          oidc-namespace: lv10-labs
          oidc-service-slug: rhisper-ci

      - name: Push .deb to Cloudsmith
        run: |
          for distro in ubuntu/jammy ubuntu/noble debian/bookworm; do
            cloudsmith push deb lv10-labs/rhisper/${distro} dist/*.deb
          done

  # Bumps Formula/rhisper.rb in the lv10/homebrew-rhisper tap repo
  # (https://github.com/lv10/homebrew-rhisper) with url/sha256 for this tag,
  # opening a PR there. Needs a HOMEBREW_TAP_TOKEN secret (a PAT with
  # contents:write on that repo) before this succeeds - same shape as the
  # Cloudsmith/AUR secrets that were added after this pipeline already
  # existed.
  publish-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to v4, not v3: v3 is a stale floating branch (last updated
      # Sept 2025) that predates an upstream fix for GitHub's tarball
      # redirect returning HTTP 303 instead of 302 - v3 fails every run with
      # "unexpected HTTP 303 response". v4 has the fix and the same inputs.
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: rhisper
          formula-path: Formula/rhisper.rb
          homebrew-tap: lv10/homebrew-rhisper
          base-branch: main
          download-url: https://github.com/lv10/rhisper/archive/refs/tags/${{ github.ref_name }}.tar.gz
          commit-message: "rhisper ${{ github.ref_name }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
