[package]
name = "rhisper"
version = "0.2.4"
edition = "2021"
description = "Dictation at cursor for Linux and macOS"
license = "MIT"
repository = "https://github.com/lv10/rhisper"
readme = "README.md"

[lib]
name = "rhisper_core"
path = "src/lib.rs"

[[bin]]
name = "rhisper"
path = "src/bin/rhisper.rs"

[[bin]]
name = "rhispertool"
path = "src/bin/rhispertool.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider", "rustls", "multipart", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
evdev = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
core-graphics = "0.25.0"
core-foundation = "0.10.1"
macos-accessibility-client = "0.0.2"

[profile.release]
opt-level = 2

[package.metadata.deb]
maintainer = "rhisper contributors"
copyright = "2026, rhisper contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Dictation at cursor for Linux. Records audio via a keybinding, transcribes \
it (Groq or OpenAI-compatible Whisper endpoints), and types the result at \
your cursor via a uinput virtual keyboard - works under both X11 and \
Wayland."""
depends = "pipewire, ffmpeg"
section = "utils"
priority = "optional"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/rhisper", "usr/bin/", "755"],
    ["target/release/rhispertool", "usr/bin/", "755"],
    ["default_rhisperrc", "usr/share/rhisper/rhisperrc.default", "644"],
    ["packaging/rhisper-uinput.rules", "usr/lib/udev/rules.d/60-rhisper-uinput.rules", "644"],
    ["README.md", "usr/share/doc/rhisper/README.md", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
assets = [
    { source = "target/release/rhisper", dest = "/usr/bin/rhisper", mode = "755" },
    { source = "target/release/rhispertool", dest = "/usr/bin/rhispertool", mode = "755" },
    { source = "default_rhisperrc", dest = "/usr/share/rhisper/rhisperrc.default", mode = "644", config = true },
    { source = "packaging/rhisper-uinput.rules", dest = "/usr/lib/udev/rules.d/60-rhisper-uinput.rules", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rhisper/README.md", mode = "644", doc = true },
]
requires = { pipewire-utils = "*", ffmpeg = "*" }
post_install_script = "packaging/rpm/postinst"
post_uninstall_script = "packaging/rpm/postun"
